<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101319" />
    <title>MITSO Study — подготовка к сессии</title>
    <meta name="description" content="Бесплатная подготовка к сессии для студентов МИТСО: вопросы с ответами, конспекты, карточки и экзамен." />
    <meta property="og:title" content="MITSO Study" />
    <meta property="og:description" content="Бесплатная подготовка к сессии для студентов МИТСО." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // тема применяется до отрисовки, чтобы не было мигания
      try {
        var t = localStorage.getItem('mitso.theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
